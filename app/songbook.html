<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"><title>Zpěvník KK</title>
    <style>
      {{styles}}
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <button id="toggle" type="button" aria-label="Menu knihovny" data-en-aria-label="Library menu" aria-controls="library" aria-expanded="false"><span class="bars"></span>
        </button><b data-en="KK Songbook">Zpěvník KK</b></div>
      <div>
        <button id="language" type="button">
        </button> <button id="theme" title="Tmavý režim" data-en-title="Dark mode" aria-label="Tmavý režim" data-en-aria-label="Dark mode" aria-pressed="false">☀</button></div>
    </header>
    <main>
      <aside id="library">
        <div class="library-title">
          <h2 data-en="Library">Knihovna</h2>
          <p id="count" role="status"></p>
        </div>
        <input type="search" id="search" placeholder="Skladba nebo interpret" data-en-placeholder="Song or artist" aria-label="Hledat" data-en-aria-label="Search">
        <label class="library-order"><span data-en="Sort by">Řadit podle</span>
          <select id="library-order">
            <option value="title" data-en="Title (A–Z)">Názvu (A–Z)</option>
            <option value="source" data-en="Original file date (newest first)">Data původního souboru (nejnovější)</option>
            <option value="imported" data-en="Songbook import (newest first)">Importu do aplikace (nejnovější)</option>
          </select>
        </label>
        <details id="library-tools">
          <summary data-en="Library tools">Nástroje knihovny</summary>
          <div class="actions">
            <section class="tool-group">
              <h3 data-en="Updates and new songs">Aktualizace a nové skladby</h3>
              <a href="https://github.com/krystofkomanec/zpevnik-kk/upload/main/inbox" target="_blank" rel="noopener" data-en="Upload a PDF">Nahrát PDF</a>
              <button id="check-library" data-en="Check for updates">Zkontrolovat aktuálnost</button>
              <button id="update-library" hidden data-en="Load latest songs">Nahrát nejnovější data</button>
              <p id="update-status" role="status" hidden></p>
              <div id="update-fallback" hidden>
                <details id="private-access">
                  <summary data-en="Private repository access">Přístup k soukromému repozitáři</summary>
                  <label><span data-en="Read-only GitHub token (this session only)">GitHub token pro čtení (jen pro toto otevření)</span> <input id="library-token" type="password" autocomplete="off" spellcheck="false">
                  </label> <button id="private-update" data-en="Load songs">Načíst skladby</button>
                </details>
                <a href="https://github.com/krystofkomanec/zpevnik-kk/releases/latest/download/library.json" target="_blank" rel="noopener" data-en="Download library.json">Stáhnout library.json</a> · <label><span data-en="Load downloaded file">Načíst stažený soubor</span> <input id="update-file" type="file" accept=".json,application/json">
              </label></div>
            </section>
            <section class="tool-group">
              <h3 data-en="Backups and reports">Záloha a připomínky</h3>
              <button id="export-settings" data-en="Export song settings">Exportovat nastavení skladeb</button>
              <button id="import-settings" data-en="Import song settings">Importovat nastavení skladeb</button>
              <input id="settings-file" type="file" accept=".json,application/json" hidden>
              <p id="settings-status" role="status" hidden></p>
              <button id="export-notes">Export připomínek</button>
            </section>
            <a id="share-songbook" href="https://github.com/krystofkomanec/zpevnik-kk/releases/latest/download/index.html" target="_blank" rel="noopener"><img alt="" width="540" height="540" src="data:image/png;base64,{{share_png}}"><span data-en="Download the latest songbook">Stáhnout nejnovější zpěvník</span>
          </a></div>
        </details>
        <div id="list"></div>
        <div id="empty-search" hidden>
          <p data-en="No matching songs.">Žádné odpovídající skladby.</p>
          <button id="clear-search" data-en="Clear search">Vymazat hledání</button></div>
      </aside>
      <article>
        <div id="play-bar"><span id="playing-title"></span>
          <span id="beat" hidden aria-hidden="true">●</span>
          <button id="play-controls-toggle" aria-expanded="false" aria-controls="play-controls" data-en="Playback">Přehrávání</button>
          <button id="exit-play" data-en="Exit play mode">Zavřít hraní</button></div>
        <div id="play-controls" hidden>
          <div><button id="auto-scroll" aria-pressed="false" data-en="Auto-scroll">Autoposun</button>
            <label><span data-en="Speed">Rychlost</span> <input type="range" id="scroll-speed" min="5" max="100" value="25"><output for="scroll-speed"></output></label></div>
          <div><button id="metronome" aria-pressed="false" data-en="Metronome">Metronom</button>
            <label><span data-en="Tempo">Tempo</span> <input type="range" id="beat-tempo" min="30" max="240" value="90"><output for="beat-tempo"></output></label></div>
        </div>
        <div class="song-head">
          <div class="meta" id="artist"></div>
          <h1 id="title"></h1>
          <div class="facts">
            <div id="cap"></div>
            <div id="harp" hidden></div>
          </div>
          <button id="guitar" class="guitar-summary" aria-haspopup="dialog" aria-controls="chart-dialog"><span data-en="Guitar chords">Kytarové hmaty</span><small id="chords"></small></button>
        </div>
        <div id="tools">
          <div class="song-actions">
            <button id="play" aria-pressed="false" data-en="Play mode">Režim hraní</button>
            <button id="song-settings-button" aria-controls="song-settings" aria-expanded="false"><span data-en="Song settings">Nastavení skladby</span><small id="pitch-hint" hidden></small><span class="settings-caret" aria-hidden="true"></span>
          </button></div>
          <div id="song-settings" hidden>
            <div class="setting-row"><span data-en="Text size">Velikost textu</span><span class="group">
                <button id="small" aria-label="Zmenšit text" data-en-aria-label="Decrease text size">A−</button> <button id="big" aria-label="Zvětšit text" data-en-aria-label="Increase text size">A+</button></span></div>
            <div class="setting-row"><span data-en="Transpose">Transpozice</span><span class="group">
                <button id="down" aria-label="O půltón níž" data-en-aria-label="Down one semitone">−</button> <button id="pitch" title="Vrátit původní tóninu" data-en-title="Restore original key">0</button> <button id="up" aria-label="O půltón výš" data-en-aria-label="Up one semitone">+</button></span></div>
            <label class="setting-row"><span data-en="Capo">Kapodastr</span>
              <select id="capo-fret">
              </select>
          </label></div>
        </div>
        <div id="score-frame"><div id="score"></div></div>
        <div id="page-nav">
          <button id="prev-page" aria-label="Předchozí stránka" data-en-aria-label="Previous page">↑</button>
          <button id="next-page" data-en="Next page ↓">Další stránka ↓</button></div>
        <p id="status" role="status"></p>
      </article>
    </main>
    <dialog id="chart-dialog" aria-labelledby="chart-title">
      <div class="chart-heading">
        <h2 id="chart-title" data-en="Guitar chords">Kytarové hmaty</h2>
        <button id="chart-close" data-en="Close">Zavřít</button>
      </div>
      <div id="charts"></div>
    </dialog>
    <div id="report-overlay" hidden>
      <form id="report-form" role="dialog" aria-modal="true" aria-labelledby="report-title">
        <h2 id="report-title" data-en="Report a line">Připomínka k řádku</h2>
        <p id="report-context"></p>
        <p id="report-text"></p>
        <label><span data-en="Issue">Problém</span>
          <select id="report-kind">
            <option value="missing-chord" data-en="Missing chord">Chybí akord</option>
            <option value="move-chord" data-en="Move a chord">Posunout akord</option>
            <option value="lyrics" data-en="Incorrect lyrics">Chybný text</option>
          </select>
        </label>
        <label><span data-en="Note (optional)">Poznámka (nepovinná)</span><textarea id="report-detail" rows="2"></textarea>
        </label>
        <p role="status" id="report-error"></p>
        <button type="submit" data-en="Save report">Uložit připomínku</button> <button id="report-cancel" type="button" data-en="Cancel">Zrušit</button>
    </form></div>
    <script>{{library}}</script>
    <script>{{reader}}</script>
  </body>
</html>
