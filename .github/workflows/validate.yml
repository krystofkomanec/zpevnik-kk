name: Validate songbook
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr-eng tesseract-ocr-ces
      - name: Run build and conversion regressions
        run: python3 -m unittest discover -s tools -v
      - name: Build and verify repeatability
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python3 tools/build.py
          sha256sum index.html library.json knihovna.js version.json README.md tools/imports.json > "$RUNNER_TEMP/songbook.sha256"
          python3 tools/build.py
          sha256sum -c "$RUNNER_TEMP/songbook.sha256"
      - name: Install browser test dependencies
        run: npm ci && npx playwright install --with-deps chromium
      - name: Test the offline HTML
        run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
