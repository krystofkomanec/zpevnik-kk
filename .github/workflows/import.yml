name: Publish songbook
on:
  push:
    branches: [main]
    paths: ['inbox/**', 'ChordPro/**', 'tools/**', 'cteni.js', 'index.html', '.github/workflows/import.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-songbook
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install PDF and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y poppler-utils tesseract-ocr-eng tesseract-ocr-ces
      - name: Build songbook
        run: python3 tools/build.py
      - name: Save converted songs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ChordPro tools/imports.json library.json version.json README.md knihovna.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh the offline song library'
            git push origin HEAD:main
          fi
      - name: Publish downloadable files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "library-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" index.html library.json --target "$(git rev-parse HEAD)" --title "Offline Songbook · build ${GITHUB_RUN_NUMBER}" --notes "Download index.html for the complete offline songbook, or library.json to update an existing copy." --latest
